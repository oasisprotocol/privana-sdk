[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oasis-privana"
version = "0.2.1"
description = "Python SDK for Privana - manage deposits, withdrawals, locks, and transfers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Oasis Protocol Foundation", email = "security@oasisprotocol.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "eth-account>=0.13.0",
    "eth-typing>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "respx>=0.22.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/oasisprotocol/privana-sdk"
Repository = "https://github.com/oasisprotocol/privana-sdk"
Issues = "https://github.com/oasisprotocol/privana-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/privana"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
